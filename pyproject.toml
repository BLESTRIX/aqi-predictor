[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi-predictor"
version = "0.1.0"
description = "Machine Learning pipeline for predicting AQI in Islamabad"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = "3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "hopsworks>=3.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.18.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "pipelines*", "config*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
